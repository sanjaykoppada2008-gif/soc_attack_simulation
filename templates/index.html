<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Attack Simulation & Test Console</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --high-sev: #ef4444;
            --med-sev: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 { margin: 0; font-size: 1.5rem; color: var(--accent-blue); }

        .panel {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid #334155;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent-blue);
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            background-color: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background-color: #475569; }
        .btn-danger { background-color: var(--high-sev); border-color: #dc2626; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: var(--accent-green); border-color: #16a34a; }
        .btn-success:hover { background-color: #16a34a; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        input, select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: var(--text-light);
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }

        .metric-card h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: var(--text-dim); }
        .metric-card p { margin: 0; font-size: 1.6rem; font-weight: bold; color: var(--accent-blue); }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px 14px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background-color: #0f172a; color: var(--text-dim); font-size: 0.8rem; }

        .sev-CRITICAL, .sev-HIGH {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--high-sev);
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .sev-MEDIUM {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--med-sev);
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SOC Telemetry & Incident Monitoring Console</h1>
        <span id="status-badge" style="color: var(--accent-green); font-weight: bold;">● API Connected</span>
    </div>

    <!-- Testing & Control Panel -->
    <div class="panel">
        <h2>HTML In-Browser Test Suite</h2>
        
        <div style="margin-bottom: 15px;">
            <p style="margin: 0 0 10px 0; color: var(--text-dim); font-size: 0.9rem;">Preset Attack Scenarios:</p>
            <div class="btn-group">
                <button class="btn btn-danger" onclick="sendPresetAttack('Encoded PowerShell Execution', 'T1059.001', 1, 'HIGH', 'powershell.exe executed -EncodedCommand payload')">Fire PowerShell Attack</button>
                <button class="btn btn-danger" onclick="sendPresetAttack('Registry Run Key Modification', 'T1547.001', 13, 'CRITICAL', 'HKCU\\...\\Run modified for persistence')">Fire Persistence Attack</button>
                <button class="btn btn-danger" onclick="sendPresetAttack('LSASS Memory Dump', 'T1003.001', 10, 'CRITICAL', 'Suspicious handle opened to lsass.exe process')">Fire LSASS Dump</button>
                <button class="btn" onclick="toggleAutoStressTest()" id="stress-btn">Start Auto Stress Test</button>
            </div>
        </div>

        <div>
            <p style="margin: 0 0 10px 0; color: var(--text-dim); font-size: 0.9rem;">Custom Payload Injector:</p>
            <form id="custom-test-form" onsubmit="sendCustomTelemetry(event)">
                <div class="form-grid">
                    <input type="text" id="host" placeholder="Host (e.g., TEST-VM)" value="BROWSER-TEST-HOST" required>
                    <input type="number" id="event_id" placeholder="Sysmon Event ID" value="1" required>
                    <input type="text" id="name" placeholder="Alert Name" value="Custom Test Trigger" required>
                    <input type="text" id="technique" placeholder="MITRE ID" value="T1059" required>
                    <select id="severity">
                        <option value="CRITICAL">CRITICAL</option>
                        <option value="HIGH" selected>HIGH</option>
                        <option value="MEDIUM">MEDIUM</option>
                    </select>
                </div>
                <div style="margin-top: 10px; display: flex; gap: 10px;">
                    <input type="text" id="description" placeholder="Description details..." value="Triggered directly from HTML test interface" required>
                    <button type="submit" class="btn btn-success" style="white-space: nowrap;">Inject Custom Alert</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Metrics Bar -->
    <div class="metrics-grid">
        <div class="metric-card">
            <h3>TOTAL ALERTS</h3>
            <p id="total-alerts">0</p>
        </div>
        <div class="metric-card">
            <h3>CRITICAL ALERTS</h3>
            <p id="critical-alerts" style="color: var(--high-sev);">0</p>
        </div>
        <div class="metric-card">
            <h3>ACTIVE MONITOR</h3>
            <p style="color: var(--accent-green);">Live (3s Poll)</p>
        </div>
    </div>

    <!-- Live Event Log Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>TIMESTAMP</th>
                    <th>HOST</th>
                    <th>EVENT ID</th>
                    <th>ALERT NAME</th>
                    <th>MITRE TECHNIQUE</th>
                    <th>SEVERITY</th>
                    <th>DESCRIPTION</th>
                </tr>
            </thead>
            <tbody id="alert-table-body">
                <!-- Data populated dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        let autoInterval = null;

        // Fetch logs from Flask API
        async function fetchAlerts() {
            try {
                const res = await fetch('/api/alerts');
                const data = await res.json();
                
                const tbody = document.getElementById('alert-table-body');
                tbody.innerHTML = '';
                let criticalCount = 0;

                data.forEach(alert => {
                    if (alert.severity === 'CRITICAL' || alert.severity === 'HIGH') criticalCount++;

                    const row = `<tr>
                        <td>${alert.timestamp}</td>
                        <td>${alert.host}</td>
                        <td>Sysmon ID ${alert.event_id}</td>
                        <td><strong>${alert.name}</strong></td>
                        <td><code>${alert.technique}</code></td>
                        <td><span class="sev-${alert.severity}">${alert.severity}</span></td>
                        <td>${alert.description}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });

                document.getElementById('total-alerts').innerText = data.length;
                document.getElementById('critical-alerts').innerText = criticalCount;
                document.getElementById('status-badge').innerText = '● API Connected';
                document.getElementById('status-badge').style.color = 'var(--accent-green)';
            } catch (err) {
                document.getElementById('status-badge').innerText = '● API Offline';
                document.getElementById('status-badge').style.color = 'var(--high-sev)';
            }
        }

        // Send preset attack payload
        async function sendPresetAttack(name, technique, eventId, severity, description) {
            const payload = {
                host: "HTML-TEST-AGENT",
                event_id: eventId,
                name: name,
                technique: technique,
                severity: severity,
                description: description
            };

            await fetch('/api/simulate-attack', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            fetchAlerts();
        }

        // Send custom payload from HTML form
        async function sendCustomTelemetry(event) {
            event.preventDefault();
            const payload = {
                host: document.getElementById('host').value,
                event_id: parseInt(document.getElementById('event_id').value),
                name: document.getElementById('name').value,
                technique: document.getElementById('technique').value,
                severity: document.getElementById('severity').value,
                description: document.getElementById('description').value
            };

            await fetch('/api/simulate-attack', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            fetchAlerts();
        }

        // Toggle automatic background attack testing
        function toggleAutoStressTest() {
            const btn = document.getElementById('stress-btn');
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                btn.innerText = 'Start Auto Stress Test';
                btn.classList.remove('btn-danger');
            } else {
                autoInterval = setInterval(() => {
                    sendPresetAttack('Automated Probe', 'T1046', 3, 'MEDIUM', 'Continuous network threat hunting simulation');
                }, 2000);
                btn.innerText = 'Stop Stress Test';
                btn.classList.add('btn-danger');
            }
        }

        // Auto-refresh table every 3 seconds
        setInterval(fetchAlerts, 3000);
        fetchAlerts();
    </script>
</body>
</html>
